services:
  db:
    image: postgres:15
    env_file:
      - .env
    # Only expose to internal network, not to host
    # For local database access, use: docker compose exec db psql -U ${POSTGRES_USER} -d ${POSTGRES_DB}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bulq-network

  redis:
    image: redis:7-alpine
    # Only expose to internal network, not to host
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bulq-network
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      args:
        - BUILD_DEV_DEPS=${BUILD_DEV_DEPS}
    # Expose backend only to internal network (accessed via Caddy)
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      # Mount source code for hot-reload in development
      # Comment out this line in production
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bulq-network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH}
    # Expose frontend only to internal network (accessed via Caddy)
    # Port depends on target: 5173 for dev (Vite), N/A for prod (static files)
    expose:
      - "5173"
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - bulq-network

  caddy:
    image: caddy:2-alpine
    ports:
      # Caddy is now the only service exposed to the host
      - "${CADDY_PORT}:${CADDY_INTERNAL_PORT}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bulq-network

volumes:
  postgres_data:
  redis_data:

networks:
  bulq-network:
    driver: bridge
