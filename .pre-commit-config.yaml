repos:
  # Python: Ruff via UV (automatically uses backend/pyproject.toml or setup/pyproject.toml)
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Linter
        entry: uvx ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: Ruff Format
        entry: uvx ruff format
        language: system
        types: [python]
        require_serial: true

      - id: backend-tests
        name: Backend Tests
        entry: just test
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

  # Frontend: ESLint (via npm, already installed)
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: docker compose exec -T frontend npm run lint:fix
        language: system
        types_or: [javascript, jsx, ts, tsx]
        files: ^frontend/
        pass_filenames: false

      - id: typescript-check
        name: TypeScript Check
        entry: docker compose exec -T frontend npm run type-check
        language: system
        types_or: [ts, tsx]
        files: ^frontend/
        pass_filenames: false

      - id: frontend-tests
        name: Frontend Unit Tests
        entry: just test-front
        language: system
        types_or: [ts, tsx, javascript, jsx]
        files: ^frontend/
        pass_filenames: false

  # Basic file checks (built-in, no installation needed)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      # - id: no-commit-to-branch
      #   args: [--branch, master, --branch, main]
