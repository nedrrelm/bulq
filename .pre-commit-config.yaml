repos:
  # Python: Ruff via UV (checks all Python files)
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff Format
        entry: uvx ruff format
        language: system
        types: [python]
        require_serial: true

      - id: ruff-check
        name: Ruff Linter
        entry: uvx ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: backend-tests
        name: Backend Tests
        entry: just test
        language: system
        types: [python]
        files: ^backend/
        pass_filenames: false

  # Frontend: TypeScript & ESLint (checks all TypeScript/JavaScript files)
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: Frontend TypeScript Check
        entry: docker compose exec -T frontend npm run type-check
        language: system
        types_or: [ts, tsx, javascript, jsx]
        files: ^frontend/src/
        pass_filenames: false
        require_serial: true

      - id: frontend-lint
        name: Frontend ESLint (auto-fix)
        entry: docker compose exec -T frontend npm run lint
        language: system
        types_or: [ts, tsx, javascript, jsx]
        files: ^frontend/src/
        pass_filenames: false
        require_serial: true

  # Basic file checks (built-in, no installation needed)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
      # - id: no-commit-to-branch
      #   args: [--branch, master, --branch, main]
  - repo: local
    hooks:
      - id: janus-validate
        name: Janus validate backlog / devlog
        entry: uv run janus validate
        language: system
        files: ^docs/(backlog|devlog)\.md$
        pass_filenames: true
