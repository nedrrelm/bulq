# Production-specific Docker Compose overrides
# Use with: docker compose -f docker-compose.yml -f deployment/docker-compose.prod.yml --env-file deployment/.env.prod up -d

services:
  backend:
    build:
      context: ./backend
      target: prod
    environment:
      - ENV=production

  frontend:
    build:
      context: ./frontend
      target: prod  # Use prod stage with built static files
    volumes:
      # Share built static files with Caddy via named volume
      - frontend-dist:/srv
    environment:
      - ENV=production

  caddy:
    volumes:
      # Use production Caddyfile
      - ./deployment/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # Mount frontend dist files (read-only)
      - frontend-dist:/srv:ro

volumes:
  # Named volume for frontend static files
  frontend-dist:
